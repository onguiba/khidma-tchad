version: '3.8'

services:
  # Backend API Node.js + SQLite
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: khidma-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-khidma_tchad_jwt_secret_2025_production}
    volumes:
      # Persister la base de données SQLite
      - ./backend/khidma_tchad.db:/app/khidma_tchad.db
      - sqlite-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/categories"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - khidma-network

  # Frontend Nginx (serving static files)
  frontend:
    image: nginx:alpine
    container_name: khidma-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ProxiTchad:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - khidma-network

volumes:
  sqlite-data:
    driver: local

networks:
  khidma-network:
    driver: bridge
